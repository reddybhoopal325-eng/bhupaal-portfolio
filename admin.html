<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portfolio Admin | Bhupaal Reddy</title><link rel="stylesheet" href="style.css"><style>
.admin-wrap{max-width:1000px;margin:50px auto;padding:24px}.admin-box{background:rgba(12,28,54,.9);border:1px solid #29486e;border-radius:16px;padding:24px;margin:18px 0}.admin-box input{padding:12px;background:#071a35;border:1px solid #45658b;color:white;border-radius:8px;width:min(100%,420px)}.admin-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.admin-comment{padding:16px 0;border-bottom:1px solid #29415f}.admin-comment p{color:#bdcbe0}.admin-comment button{margin-right:8px;padding:8px 12px;border:0;border-radius:7px;cursor:pointer}.approve{background:#176b50;color:white}.delete{background:#7c2845;color:white}.admin-muted{color:#9eb2cd;font-size:12px}
</style></head><body><div class="admin-wrap"><a class="brand" href="index.html"><span class="brand-mark">BR<span>.</span></span><span><b>BHUPAAL REDDY</b><small>PORTFOLIO ADMIN</small></span></a><h1 style="font-family:'Space Grotesk';margin-top:45px">Portfolio dashboard</h1><p class="admin-muted">Review and approve visitor comments. Keep your admin token private.</p><div class="admin-box"><div class="admin-row"><input id="token" type="password" placeholder="Enter your ADMIN_TOKEN"><button class="btn primary" id="load">Load dashboard</button></div><p id="status" class="admin-muted" aria-live="polite"></p></div><div class="admin-box"><h2>Visitor engagement</h2><p class="admin-muted">Views, likes and approved comments are shown on the public portfolio. This panel manages comment moderation.</p><div id="comments"></div></div></div><script>
const tokenInput=document.querySelector("#token"),statusEl=document.querySelector("#status"),list=document.querySelector("#comments");
async function request(path,method="GET",body){const r=await fetch(path,{method,headers:{"Content-Type":"application/json","Authorization":"Bearer "+tokenInput.value},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||"Request failed");return d;}
async function load(){try{const d=await request("/api/admin/comments");list.innerHTML=d.comments.length?d.comments.map(c=>`<div class="admin-comment"><b>${esc(c.name)}</b> <span class="admin-muted">· ${esc(c.status)} · ${esc(c.created_at)}</span><p>${esc(c.comment)}</p><button class="approve" data-action="approve" data-id="${c.id}">Approve</button><button class="delete" data-action="delete" data-id="${c.id}">Delete</button></div>`).join(""):'<p class="admin-muted">No comments yet.</p>';statusEl.textContent="Dashboard loaded.";}catch(e){statusEl.textContent=e.message;}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
document.querySelector("#load").addEventListener("click",load);
list.addEventListener("click",async e=>{const b=e.target.closest("[data-action]");if(!b)return;try{await request("/api/admin/comments","POST",{id:Number(b.dataset.id),action:b.dataset.action});await load();}catch(err){statusEl.textContent=err.message;}});
</script></body></html>
